name: Go
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build:
    name: Build on limited environment
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: build
      run: docker compose run go-json

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest", "macos-latest", "windows-latest" ]
        go-version: [ "1.25", "1.26", "1.27" ]
    runs-on: ${{ matrix.os }}
    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: setup Go ${{ matrix.go-version }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
    - name: simple test
      run: go test -v ./... -count=1
    - name: test with GC pressure
      run: go test -v ./... -count=1
      env:
        GOGC: 1
    - name: test with race detector
      run: go test -v -race ./... -count=1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: lint
        run: |
          make lint
  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # the master branch is required to measure the baseline.
          fetch-depth: 0
      - name: setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      # A verdict is saved only when the job succeeds,
      # so re-running a passed commit ends immediately and a failed commit is measured again.
      # The baseline is always measured in the same job because it is never shared between machines.
      - name: restore benchmark verdict
        uses: actions/cache@v6
        with:
          path: .git/benchcheck/verdict
          key: benchcheck-verdict-${{ github.sha }}
      - name: check performance degradation
        run: make bench-check BENCH_CHECK_FLAGS="-base origin/master"

  bench-compare:
    # It never fails by the result: it exists to read how go-json compares with sonic on amd64,
    # where sonic compiles the encoder of a type to machine code.
    name: Compare with sonic
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: compare the encode benchmarks
        run: make bench-compare-encode

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: measure coverage
        run: make cover
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
