name: Go
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build:
    name: Build on limited environment
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: build
      run: docker compose run go-json

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest", "macos-latest", "windows-latest" ]
        go-version: [ "1.25", "1.26", "1.27" ]
    runs-on: ${{ matrix.os }}
    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: setup Go ${{ matrix.go-version }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
    - name: simple test
      run: go test -v ./... -count=1
    - name: test with GC pressure
      run: go test -v ./... -count=1
      env:
        GOGC: 1
    - name: test with race detector
      run: go test -v -race ./... -count=1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: lint
        run: |
          make lint
  bench:
    # The benchmark functions are measured in three parts, one by each job, so that the check ends within
    # a few minutes: a part has the benchmarks of every kind ( see -shard of internal/cmd/benchcheck ).
    name: Benchmark (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [ 0, 1, 2 ]
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # the master branch is required to measure the baseline.
          fetch-depth: 0
      - name: setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: |
            go.sum
            benchmarks/go.sum
      # A verdict is saved only when the job succeeds, so a failed commit is measured again.
      # The key has the attempt of the run: re-running the job measures again, on the machine it gets,
      # because the machines of the CI differ and a single measurement is not conclusive.
      # The baseline is always measured in the same job because it is never shared between machines.
      - name: restore benchmark verdict
        uses: actions/cache@v6
        with:
          path: .git/benchcheck/verdict
          key: benchcheck-verdict-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.shard }}
      - name: check performance degradation
        run: make bench-check BENCH_CHECK_FLAGS="-base origin/master -shard ${{ matrix.shard }}/3"

  bench-last-commit:
    # It never fails by the result: it measures what the last commit of a pull request changed, in three parts.
    if: github.event_name == 'pull_request'
    name: Measure the last commit (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [ 0, 1, 2 ]
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # the previous commit is required to measure what the last commit changed.
          fetch-depth: 0
      - name: setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: |
            go.sum
            benchmarks/go.sum
      # The machines of the CI differ, so a commit is compared with its parent on the same machine.
      # HEAD is the merge commit of the pull request, whose second parent is the head of the branch.
      - name: measure what the last commit changed
        run: make bench-check BENCH_CHECK_FLAGS="-base HEAD^2~1 -no-cache -bench 'Encode_|Marshal|Twitter|Decode_' -shard ${{ matrix.shard }}/3" || true

  bench-compare:
    # It never fails by the result: it exists to read how go-json compares with sonic on amd64,
    # where sonic compiles the encoder of a type to machine code. Each task is a job of its own.
    name: Compare with sonic (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: encode
            run: make bench-compare-encode
          # sonic inlines the nested structs into the code of a type up to 3 levels by default.
          # It is also measured with more levels, so that it is compared in the way which is the best for it.
          - name: encode, sonic inlining more
            run: SONIC_MAX_INLINE_DEPTH=10 make bench-compare-encode
          - name: decode
            run: make bench-compare-decode && make bench-profile-decode
          - name: profile encode
            run: make bench-profile-encode
          - name: candidates of the optimizations
            run: make bench-variants
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: |
            go.sum
            benchmarks/go.sum
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: measure coverage
        run: make cover
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
