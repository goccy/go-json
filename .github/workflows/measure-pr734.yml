name: Measure PR 734 on amd64
# A throwaway workflow of a measure/* branch: v0.10.5, master and the PR, built with several random function layouts
# and run interleaved on the same runner, on runners of different CPUs; encoding/json and sonic once.
on:
  push:
    branches:
      - measure/pr734-amd64
jobs:
  ab:
    name: A/B (${{ matrix.run }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6]
    env:
      LAYOUTS: '4'
      ROUNDS: '2'
      MASTER: 9ca77b36eb30cfefbfc545efa3113e4555f5f34a
      PR: ${{ github.sha }}
      BUFFERED: '^(BenchmarkUnicodeDecoder|BenchmarkDecoderStream|BenchmarkCodeDecoder|Benchmark_Decode_(Small|Medium|Large)Struct_Stream_GoJson)$'
      STREAMED: '^(Benchmark_Decode_SlowReader_GoJson|Benchmark_Decode_[A-Za-z]+_ChunkedStream_GoJson)$'
      OTHERS: '^(Benchmark_Decode_[A-Za-z]+_ChunkedStream_(Sonic|SonicStd|EncodingJson)|Benchmark_Decode_SlowReader_EncodingJson)$'
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: |
            go.sum
            benchmarks/go.sum
      - name: A/B
        run: |
          lscpu | grep 'Model name'
          go install golang.org/x/perf/cmd/benchstat@latest
          git worktree add /tmp/master $MASTER > /dev/null 2>&1
          git worktree add /tmp/pr $PR > /dev/null 2>&1
          git worktree add /tmp/v0105 v0.10.5 > /dev/null 2>&1
          rm -rf /tmp/v0105/benchmarks
          cp -r /tmp/master/benchmarks /tmp/v0105/benchmarks
          rm -f /tmp/v0105/benchmarks/*.go
          cp measure/v0105bench/* /tmp/v0105/benchmarks/
          for v in master pr v0105; do
            for l in $(seq $LAYOUTS); do
              (cd /tmp/$v/benchmarks && go test -c -ldflags="-randlayout=$((l + 100 * ${{ matrix.run }}))" -o /tmp/$v.$l.test .) || exit 1
            done
          done
          for r in $(seq $ROUNDS); do
            for l in $(seq $LAYOUTS); do
              for v in master pr; do
                (cd /tmp/$v/benchmarks && /tmp/$v.$l.test -test.run '^$' -test.bench "$BUFFERED" -test.benchtime 200ms | grep '^Benchmark' >> /tmp/buf_$v.txt)
              done
              for v in v0105 master pr; do
                (cd /tmp/$v/benchmarks && /tmp/$v.$l.test -test.run '^$' -test.bench "$STREAMED" -test.benchtime 200ms | grep '^Benchmark' >> /tmp/str_$v.txt)
              done
            done
          done
          (cd /tmp/pr/benchmarks && /tmp/pr.1.test -test.run '^$' -test.bench "$OTHERS" -test.benchtime 200ms | grep '^Benchmark' > /tmp/others.txt)
          echo '### buffered: master / pr'
          $(go env GOPATH)/bin/benchstat master=/tmp/buf_master.txt pr=/tmp/buf_pr.txt | awk '/sec\/op/ {on=1} on {print} /^geomean/ && on {exit}'
          echo '### streamed: v0.10.5 / master / pr'
          $(go env GOPATH)/bin/benchstat v0105=/tmp/str_v0105.txt master=/tmp/str_master.txt pr=/tmp/str_pr.txt | awk '/sec\/op/ {on=1} on {print} /^geomean/ && on {exit}'
          echo '### encoding/json and sonic'
          sed 's/^/OTHER /' /tmp/others.txt
