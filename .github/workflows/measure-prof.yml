name: Count code set lookups
on:
  push:
    branches:
      - 'measure/**'
jobs:
  measure:
    name: Measure (${{ matrix.machine }})
    if: false
    strategy:
      fail-fast: false
      matrix:
        machine: [1]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: |
            go.sum
            benchmarks/go.sum
      - name: measure
        run: .github/measure/count.sh
