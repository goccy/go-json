name: Measure report encode
on:
  push:
    branches:
      - 'measure/**'
jobs:
  measure:
    name: Measure (${{ matrix.machine }})
    strategy:
      fail-fast: false
      matrix:
        machine: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: |
            go.sum
            benchmarks/go.sum
      - name: build
        run: |
          lscpu | sed -n 's/^Model name: *//p' | head -1
          git worktree add ../master origin/master
          git worktree add ../head origin/perf/encoder-string-escape
          (cd ../master/benchmarks && go test -c -o /tmp/master.test .)
          (cd ../head/benchmarks && go test -c -o /tmp/head.test .)
      - name: measure
        env:
          BENCH_REPORT_ONLY: '^(std|fast|fastest|v2)/(go-json|sonic)/encode/'
          BENCH_REPORT_ROUNDS: '1'
        run: |
          for round in 1 2 3 4 5; do
            for ref in master head; do
              (cd ../$ref/benchmarks && BENCH_REPORT_OUT=/tmp/$ref-$round.json /tmp/$ref.test -test.run '^TestReport$' -test.count=1 -test.timeout 60m -test.benchtime=100ms > /dev/null)
            done
          done
          python3 .github/measure/table.py /tmp
