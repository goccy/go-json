name: Measure report encode
on:
  push:
    branches:
      - 'measure/**'
jobs:
  measure:
    name: Measure (${{ matrix.machine }})
    strategy:
      fail-fast: false
      matrix:
        machine: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: |
            go.sum
            benchmarks/go.sum
      - name: measure
        env:
          MACHINE: ${{ matrix.machine }}
        run: VARIANTS='master v10' LAYOUTS=8 ROUNDS=5 BENCH='BenchmarkAppendString/[a-z]+/(0|3|6|32|36|50|64|100|300|1000|10000)$' .github/measure/str_variants.sh
