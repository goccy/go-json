name: Measure SmallStructCached field order
# A throwaway workflow of a measure/* branch ( see .github/measure/same_code_layouts.sh ).
on:
  push:
    branches:
      - measure/small-struct-cached-layout
jobs:
  measure:
    name: measure (shard ${{ matrix.shard }}, ${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
        run: [a, b, c]
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            go.sum
            benchmarks/go.sum
      - name: measure
        run: bash .github/measure/same_code_layouts.sh ${{ matrix.shard }}
