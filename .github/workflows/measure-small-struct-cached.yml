name: Measure SmallStructCached field order
# A throwaway workflow of a measure/* branch ( see .github/measure/small_struct_cached.sh ).
on:
  push:
    branches:
      - measure/small-struct-cached-layout
jobs:
  measure:
    name: measure (${{ matrix.run }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6]
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            go.sum
            benchmarks/go.sum
      - name: measure
        run: |
          cp .github/measure/small_struct_cached.sh /tmp/measure.sh
          bash /tmp/measure.sh
